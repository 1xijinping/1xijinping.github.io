<style>
  :root{
    --paper:#F7F3EC;
    --paper-2:#FCF9F3;
    --card:#FFFFFD;
    --ink:#2B2621;
    --ink-2:#544B41;
    --muted:#93887A;
    --line:#E8E0D3;
    --line-2:#F1EBE0;
    --accent:#AE553A;
    --accent-deep:#8C3F28;
    --accent-soft:#F8E8E0;
    --ok:#4E7A57;
    --warn:#B4792C;
    --bad:#B0453B;
    --shadow:0 1px 2px rgba(43,38,33,.04), 0 10px 26px -16px rgba(43,38,33,.28);
    --r:20px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"AppleMyungjo","Nanum Myeongjo","Times New Roman",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171512;
      --paper-2:#1E1B17;
      --card:#211E19;
      --ink:#F0E9DC;
      --ink-2:#CFC5B5;
      --muted:#968B7C;
      --line:#332E27;
      --line-2:#2A2621;
      --accent:#E28B6C;
      --accent-deep:#F0A487;
      --accent-soft:#3A2A22;
      --ok:#8FBF97;
      --warn:#D8A45F;
      --bad:#E0847A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
    letter-spacing:-.01em;
    min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(1100px 520px at 8% -12%, rgba(255,247,232,.9) 0%, rgba(255,247,232,0) 60%),
      radial-gradient(900px 480px at 102% -4%, rgba(238,232,219,.75) 0%, rgba(238,232,219,0) 55%),
      var(--paper);
    background-attachment:fixed;
    overflow-x:hidden;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark){
    body{background:
      radial-gradient(1100px 520px at 8% -12%, rgba(58,42,34,.55) 0%, rgba(58,42,34,0) 60%),
      radial-gradient(900px 480px at 102% -4%, rgba(40,36,30,.6) 0%, rgba(40,36,30,0) 55%),
      var(--paper);}
  }
  @media (min-width:920px){ body{padding-bottom:0} }
  [hidden]{display:none !important}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  textarea{resize:vertical;-webkit-appearance:none;appearance:none}
  a{color:var(--accent)}
  ::selection{background:var(--accent-soft);color:var(--ink)}
  :focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 70%, transparent);outline-offset:2px}
  svg{display:block}

  /* ---------- shell ---------- */
  .shell{display:flex;align-items:flex-start;max-width:1440px;margin:0 auto;min-height:100vh;min-height:100dvh}
  .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  .side{display:none}
  @media (min-width:920px){
    .side{
      display:flex;flex-direction:column;gap:26px;
      width:252px;flex:0 0 252px;height:100dvh;position:sticky;top:0;
      padding:30px 22px;border-right:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,253,248,.55),rgba(247,243,236,0) 70%);
    }
    @media (prefers-color-scheme: dark){
      .side{background:linear-gradient(180deg,rgba(33,30,25,.6),rgba(23,21,18,0) 70%)}
    }
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .side-brand .mk{font-size:22px;line-height:1}
  .side-brand .tx{font-family:var(--serif);font-size:19px;letter-spacing:-.01em}
  .side-brand .tx em{font-style:italic}
  .sidenav{display:flex;flex-direction:column;gap:4px}
  .sidenav button{
    display:flex;align-items:center;gap:11px;
    padding:11px 12px;border-radius:13px;font-size:14.5px;color:var(--ink-2);
    transition:background .18s, color .18s;
  }
  .sidenav button svg{width:18px;height:18px;opacity:.7}
  .sidenav button:hover{background:color-mix(in srgb, var(--ink) 5%, transparent)}
  .sidenav button.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
  .sidenav button.on svg{opacity:1}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
  .side-foot .note{font-size:11.5px;line-height:1.6;color:var(--muted);margin:0}
  .ghost-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 12px;border:1px solid var(--line);border-radius:11px;font-size:13px;color:var(--ink-2);
    background:var(--card);
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent-deep)}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    backdrop-filter:blur(16px) saturate(1.2);
    border-bottom:1px solid transparent;
  }
  .topbar-brand{display:flex;align-items:baseline;gap:7px;font-family:var(--serif);font-size:18px;letter-spacing:-.01em;min-width:0}
  .topbar-brand .mk{font-size:17px}
  .topbar-brand em{font-style:italic}
  .topbar-date{margin-left:auto;font-size:11.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--card)}
  .icon-btn:hover{color:var(--accent-deep);border-color:var(--accent)}
  .icon-btn svg{width:17px;height:17px}
  @media (min-width:920px){
    .topbar{position:static;padding:28px 44px 4px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
    .topbar-brand{display:none}
    .topbar-date{margin-left:0;font-size:12.5px;letter-spacing:.04em}
    .icon-btn{margin-left:auto}
  }

  /* ---------- views ---------- */
  #viewRoot{flex:1 1 auto;padding:4px 16px 26px}
  @media (min-width:920px){ #viewRoot{padding:12px 44px 70px} }
  .view{display:none}
  .view.on{display:block;animation:rise .26s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .appfoot{display:none}
  @media (min-width:920px){
    .appfoot{display:block;padding:0 44px 28px;font-size:11.5px;color:var(--muted)}
    .appfoot button{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  }

  /* ---------- basics ---------- */
  .stack{display:flex;flex-direction:column;gap:14px;min-width:0}
  .row{display:flex;align-items:center;gap:9px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
  .display{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1.12;margin:0;font-size:clamp(25px,6.4vw,32px)}
  .display .wd{font-family:var(--sans);font-size:.44em;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:.4em}
  .subtle{color:var(--muted);font-size:12px}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 2px 16px}
  @media (min-width:920px){ .view-head{margin:18px 2px 20px} }

  .card{
    min-width:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:17px;
    box-shadow:var(--shadow);
  }
  @media (min-width:920px){ .card{padding:21px;border-radius:22px} }
  .card-title{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:40px;padding:0 15px;border-radius:12px;font-size:13.5px;font-weight:600;white-space:nowrap;
    transition:transform .12s, background .18s, border-color .18s, color .18s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -10px var(--accent)}
  .btn-primary:hover{background:var(--accent-deep)}
  @media (prefers-color-scheme: dark){ .btn-primary{color:#1B1712} }
  .btn-soft{background:var(--accent-soft);color:var(--accent-deep)}
  .btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
  .btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}

  .inp{
    width:100%;height:42px;padding:0 12px;
    background:var(--paper-2);border:1px solid var(--line);border-radius:11px;
    color:var(--ink);outline:none;transition:border-color .18s, background .18s;
  }
  .inp::placeholder{color:var(--muted);opacity:.85}
  .inp:focus{border-color:var(--accent);background:var(--card)}
  textarea.inp{height:auto;padding:10px 12px;line-height:1.55}

  /* ---------- today ---------- */
  .today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  @media (min-width:920px){
    .today-grid{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:18px;align-items:start}
  }
  .hero{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:18px;
    background:linear-gradient(140deg, var(--card) 20%, color-mix(in srgb, var(--accent-soft) 55%, var(--card)) 100%);
  }
  .hero::after{
    content:"D";position:absolute;right:-6px;bottom:-64px;
    font-family:var(--serif);font-style:italic;font-size:190px;line-height:1;
    color:var(--ink);opacity:.045;pointer-events:none;
  }
  .hero-day{font-family:var(--serif);font-size:58px;line-height:.9;letter-spacing:-.04em;color:var(--accent-deep)}
  .hero-meta{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  .hero-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
  .hero-next{min-width:0;flex:1}
  .hero-next .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  .hero-next .t{font-size:14.5px;font-weight:600;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hero-next .w{font-size:12px;color:var(--ink-2);margin:5px 0 0}

  .ev-list{list-style:none;margin:6px 0 0;padding:0}
  .ev{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
  .ev:first-child{border-top:0}
  .ev .check{
    width:20px;height:20px;flex:0 0 auto;margin-top:1px;border-radius:50%;
    border:1.5px solid color-mix(in srgb, var(--muted) 55%, transparent);
    color:transparent;font-size:11px;display:grid;place-items:center;transition:.16s;
  }
  .ev .check:hover{border-color:var(--ok)}
  .ev.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
  .ev-body{flex:1;min-width:0}

  .rfld .inp{width:100%;height:38px;min-width:0;padding:0 7px;font-size:13.5px}

  .rsum b{color:var(--ink-2);font-weight:650}

  .catnew{display:flex;flex-direction:column;gap:6px;padding:8px 9px;border-radius:11px;background:color-mix(in srgb, var(--accent-soft) 32%, var(--paper-2));border:1px dashed color-mix(in srgb, var(--accent) 36%, var(--line))}
  .catnew[hidden]{display:none}

  .ev-range{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.01em;color:color-mix(in srgb, var(--c, var(--accent)) 66%, var(--ink))}

  .memo-card{display:flex;flex-direction:column}  .memo{
    width:100%;border:0;background:transparent;outline:none;

    padding:6px 0 0;min-height:96px;color:var(--ink);resize:none;border-radius:0;box-shadow:none;

  /* ---------- 오늘의 한마디 ---------- */
  .cheer{
    display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;

  }

    content:"”";position:absolute;right:16px;top:0;font-family:var(--serif);

    height:26px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:650;white-space:nowrap;
    color:var(--ink-2);background:color-mix(in srgb, var(--card) 70%, transparent);border:1px solid var(--line);
    transition:background .16s, border-color .16s, color .16s;
  }
  .cchip:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  .cchip.on{background:color-mix(in srgb, var(--accent) 20%, var(--card));border-color:color-mix(in srgb, var(--accent) 55%, var(--line));color:var(--accent-deep)}
  .cheer-quote{
    margin:0;position:relative;z-index:1;font-family:var(--serif);font-size:18px;line-height:1.6;

  }
  @media (min-width:920px){ .cheer-quote{font-size:19px} }
  .cheer-foot{display:flex;align-items:center;gap:6px;position:relative;z-index:1}

  .cheer-btn{
    display:inline-flex;align-items:center;gap:4px;height:29px;padding:0 10px;border-radius:9px;white-space:nowrap;
    font-size:11.5px;font-weight:650;color:var(--ink-2);background:var(--card);border:1px solid var(--line);

  }

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}

    display:flex;flex-direction:column;gap:3px;text-align:left;transition:border-color .18s;
  }

  .stat .k{font-size:10.5px;color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-family:var(--serif);font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v small{font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-left:1px}

  .up .dd{flex:0 0 auto;font-size:11px;font-weight:650;color:var(--muted)}
  .up .dd.soon{color:var(--accent-deep)}

  /* ---------- calendar ---------- */
  .cal-grid-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}

  .cal-card{padding:14px 12px 12px}

  .dow span{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.04em;padding:4px 0}
  .dow span:first-child{color:color-mix(in srgb, var(--bad) 78%, var(--muted))}
  .dow span:last-child{color:#5C7C9E}
  .cal{display:flex;flex-direction:column;gap:4px}
  .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
  .cell{
    position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:3px;min-height:44px;padding:6px 2px 5px;border-radius:11px;

    display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:99px;
    font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:0;
  }
  @media (min-width:920px){ .cell .dn{min-width:22px;height:22px;font-size:13px} }

  .cell.sel{background:color-mix(in srgb, var(--ink) 5%, transparent)}

  @media (min-width:1040px){ .cal-card .cm{display:block} }

  /* 형광펜 기간 띠 (highlighter range bar) */

    display:block;align-self:stretch;height:12px;line-height:12px;
    font-size:8.5px;font-weight:700;letter-spacing:-.03em;padding:0 3px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;text-align:left;
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--c) 34%, var(--card)) 0%,

  .hl.br{margin-right:-5px}

  .legend{display:flex;flex-wrap:wrap;gap:6px 13px;padding:12px 4px 2px;margin-top:8px;border-top:1px solid var(--line-2)}

  .list-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .list-total{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .list-total small{font-family:var(--sans);font-size:10px;color:var(--muted);margin-left:6px;letter-spacing:0}
  .rows{list-style:none;margin:0;padding:0}
  .row-exp{display:grid;grid-template-columns:38px minmax(0,78px) minmax(0,1fr) auto 24px;align-items:center;gap:8px;padding:8px 1px;border-top:1px solid var(--line-2)}
  .row-exp:first-child{border-top:0}
  .row-exp:hover{background:color-mix(in srgb, var(--ink) 3%, transparent)}
  .row-exp .ed{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0}
  .cb{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;font-size:9.5px;font-weight:650;color:var(--ink-2);background:color-mix(in srgb, var(--cc) 12%, transparent);padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden}
  .cb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cb i{width:5px;height:5px;border-radius:50%;background:var(--cc);flex:0 0 auto}
  .row-exp .en{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-exp .en.none{color:var(--muted)}
  .row-exp .ea{font-family:var(--serif);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
  .row-exp .ea .won{font-family:var(--sans);font-size:9.5px;color:var(--muted);margin-left:1px}
  .rows .empty{padding:16px 2px}

  /* ---------- campaigns ---------- */
  .camp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:13px}
  @media (min-width:700px){ .camp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px} }
  @media (min-width:1180px){ .camp-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .camp{display:flex;flex-direction:column;gap:10px;padding:16px;position:relative;overflow:hidden}
  .camp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .plat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;letter-spacing:.02em;color:var(--ink-2)}
  .plat::before{content:"";width:5px;height:5px;border-radius:50%;background:color-mix(in srgb, var(--ink) 35%, transparent)}
  .mono{font-family:var(--sans);font-variant-numeric:tabular-nums}
  img,svg{max-width:100%}
  .dd{
    font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:99px;
    color:var(--muted);background:color-mix(in srgb, var(--ink) 6%, transparent);white-space:nowrap;
  }
  .dd.soon{color:#8A4A18;background:#F7E3CC}
  .dd.hot{color:#fff;background:var(--accent)}
  .dd.past{color:var(--muted);background:transparent;border:1px solid var(--line)}
  @media (prefers-color-scheme: dark){
    .dd.soon{color:#F0C08A;background:#3C2C1D}
    .dd.hot{color:#1B1712}
  }
  .camp h3{margin:0;font-size:14.5px;line-height:1.4;font-weight:650;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .camp-meta{margin:0;font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
  .camp-meta b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
  .miss{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
  .miss li{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
  .mchk{
    flex:0 0 auto;width:16px;height:16px;margin-top:2px;border-radius:5px;
    border:1.4px solid color-mix(in srgb, var(--muted) 55%, transparent);color:transparent;
    display:grid;place-items:center;font-size:9px;transition:.15s;
  }
  .mchk:hover{border-color:var(--ok)}
  .miss li.done .mchk{background:var(--ok);border-color:var(--ok);color:#fff}
  .miss li span{font-size:12.2px;line-height:1.45;color:var(--ink-2);word-break:keep-all}
  .miss li.done span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .camp-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-2)}
  .camp-foot .track{flex:1;height:4px}
  .camp-foot .pct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .camp-foot .del{margin-left:2px}
  .camp-new{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .field label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .field .inp{height:38px;font-size:14.5px}
  .field-row{display:flex;gap:9px}
  .camp-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 18px;text-align:center;color:var(--muted);font-size:13px}
  .camp-empty .empty{margin:0}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--card) 88%, transparent);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    backdrop-filter:blur(20px) saturate(1.3);
    border-top:1px solid var(--line);
  }
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:10px;letter-spacing:.01em}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--accent-deep)}
  .tabbar button.on svg{stroke-width:2}
  @media (min-width:920px){ .tabbar{display:none} }

  /* ---------- sheet ---------- */
  #sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
  .sheet-bd{position:absolute;inset:0;background:rgba(28,23,18,.4);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s ease}
  .sheet-panel{
    position:relative;width:100%;max-width:470px;max-height:88vh;max-height:88dvh;overflow:auto;
    background:var(--card);border-radius:26px 26px 0 0;
    padding:10px 20px calc(26px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 44px rgba(0,0,0,.22);
    animation:sheetUp .3s cubic-bezier(.2,.8,.25,1);
  }
  @media (min-width:920px){ #sheet{align-items:center} .sheet-panel{border-radius:26px;padding:12px 26px 26px} }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px}
  .sheet-panel h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .sheet-panel .note{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 16px}
  .sheet-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .sheet-row .btn{flex:1 1 auto}
  .sheet-sep{height:1px;background:var(--line);margin:18px 0}
  .danger-zone{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .danger-zone p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
  .btn-danger{color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);background:transparent}
  .ver{margin:20px 0 0;font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.05em}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
    padding:11px 14px;border-radius:13px;
    background:var(--ink);color:var(--paper);font-size:12.5px;
    box-shadow:0 14px 34px -12px rgba(0,0,0,.5);
    transition:opacity .22s, transform .22s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{color:var(--accent);font-weight:700;font-size:12.5px;white-space:nowrap}
  @media (prefers-color-scheme: dark){ #toast{background:#EFE7D9;color:#241F19} #toast button{color:#8C3F28} }
  @media (min-width:920px){ #toast{bottom:24px} }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ============================================================
     기본 상수
  ============================================================ */
  var KEY = 'diary.v1';
  var WD = ['일', '월', '화', '수', '목', '금', '토'];

  var CATS = {
    '체험단': { c: '#C06D84', e: '🎁' },
    '병원': { c: '#4F7F8C', e: '🏥' },

    '가족': { c: '#6E8F62', e: '🏡' }
  };
  var CAT_ORDER = Object.keys(CATS);

  /* 직접 만든 카테고리 — 기본 4개는 늘 먼저 나오고, 새로 만든 것은 뒤에 붙습니다 */
  var CAT_SWATCH = [
    { k: '라벤더', c: '#8B7BB8' },
    { k: '민트', c: '#4E9A8E' },
    { k: '코랄', c: '#D9705F' },
    { k: '블루', c: '#5B7FA8' },
    { k: '옐로우', c: '#C2A02E' }
  ];
  var NEW_CAT = '__new';

  function customCats() {
    return (state && state.cats && typeof state.cats === 'object' && !Array.isArray(state.cats)) ? state.cats : {};
  }
  function catOf(name) {
    var cc = customCats();
    if (cc[name] && cc[name].c) return cc[name];
    return CATS[name] || CATS['가족'];
  }
  function catOrder() {
    var cc = customCats();
    var out = CAT_ORDER.slice();
    Object.keys(cc).forEach(function (k) {
      if (out.indexOf(k) < 0 && !CATS[k]) out.push(k);
    });
    return out;
  }

  var ISSUERS = [
    { k: '신한', c: '#0046FF' },
    { k: '국민', c: '#F2B705' },

    { k: '케이뱅크', c: '#5B2C83' },

    { k: '현대', c: '#2B3A55' },
    { k: '우체국', c: '#D6001C' }
  ];

  var SWATCHES = ['#0046FF', '#1428A0', '#03C75A', '#00857E', '#F2B705', '#E0762F', '#DA291C', '#C06D84', '#5B2C83', '#2B3A55', '#B08C4A', '#8C8C8C'];

  /* 매일 한마디 — 날짜에 따라 바뀌는 문구 세트 (누구에게나 와닿는 말로만) */
  var CHEER = {
    self: [
      '오늘도 충분히 잘 해내고 있어.',

  /* ============================================================
     유틸
  ============================================================ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function num(n) { return Math.round(Number(n) || 0).toLocaleString('ko-KR'); }
  function digits(v) { var d = String(v == null ? '' : v).replace(/[^\d]/g, ''); return d ? Number(d) : 0; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dstr(new Date()); }
  function parseD(s) { var p = String(s || '').split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
  function weekday(s) { return WD[parseD(s).getDay()]; }
  function dayDiff(a, b) { return Math.round((parseD(a) - parseD(b)) / 86400000); }
  function monthKey(s) { return String(s || '').slice(0, 7); }
  function mmdd(s) { var p = String(s).split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }

  /* ============================================================
     초기 데이터 / 저장
  ============================================================ */
  function seed() {
    return {
      v: 2,
      events: [],
      memos: {},
      cards: [],
      expenses: [],
      campaigns: [],
      cats: {}
    };
  }

  function normalize(s) {
    if (!s || typeof s !== 'object') return seed();
    var inCats = (s.cats && typeof s.cats === 'object' && !Array.isArray(s.cats)) ? s.cats : {};
    var cats = {};
    Object.keys(inCats).forEach(function (k) {
      var v = inCats[k] || {};
      var nm = String(k || '').trim().slice(0, 10);
      if (!nm || CATS[nm] || nm === NEW_CAT) return;
      var col = (typeof v.c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v.c)) ? v.c : CAT_SWATCH[0].c;
      cats[nm] = { c: col, e: v.e ? String(v.e).slice(0, 4) : '🏷️' };
    });
    s.cats = cats;
    s.events = Array.isArray(s.events) ? s.events.filter(Boolean).map(function (e) {
      var d = e.date || todayStr();
      var ed = (typeof e.endDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.endDate) && e.endDate > d) ? e.endDate : '';
      return {
        id: e.id || uid(), date: d, endDate: ed, time: e.time || '',
        title: e.title || '', cat: (CATS[e.cat] || cats[e.cat]) ? e.cat : '가족', done: !!e.done
      };
    }) : [];
    s.memos = (s.memos && typeof s.memos === 'object' && !Array.isArray(s.memos)) ? s.memos : {};
    s.cards = Array.isArray(s.cards) ? s.cards.filter(Boolean).map(function (c) {
      return {
        id: c.id || uid(), issuer: c.issuer || '', name: c.name || '',
        color: /^#[0-9a-fA-F]{3,8}$/.test(c.color || '') ? c.color : '#8C8C8C',
        target: Number(c.target) || 0, memo: c.memo || ''
      };
    }) : [];
    s.expenses = Array.isArray(s.expenses) ? s.expenses.filter(Boolean).map(function (e) {
      return {
        id: e.id || uid(), date: e.date || todayStr(), cardId: e.cardId || '',
        amount: Number(e.amount) || 0, memo: e.memo || '', ts: Number(e.ts) || 0
      };
    }) : [];
    s.campaigns = Array.isArray(s.campaigns) ? s.campaigns.filter(Boolean).map(function (c) {
      return {
        id: c.id || uid(), name: c.name || '이름 없는 체험단', platform: c.platform || '',
        visit: c.visit || '', due: c.due || '', memo: c.memo || '',
        missions: Array.isArray(c.missions) ? c.missions.filter(Boolean).map(function (m) {
          return { id: m.id || uid(), t: m.t || '', done: !!m.done };
        }) : []
      };
    }) : [];
    s.v = 2;
    return s;
  }

  var state;
  try {
    var raw = localStorage.getItem(KEY);
    state = raw ? normalize(JSON.parse(raw)) : seed();
  } catch (err) {
    state = seed();
  }

  var saveTimer = null;
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(KEY + '.saved', new Date().toISOString());
    } catch (err) { /* 저장 공간이 없는 경우 조용히 넘어감 */ }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
  save();

  function cheerList() { return CHEER[cheerMode === 'partner' ? 'partner' : 'self']; }
  function cheerText() {
    var list = cheerList();
    var base = Math.floor(parseD(todayStr()).getTime() / 86400000);
    var i = (((base + cheerOffset) % list.length) + list.length) % list.length;
    return { text: list[i], mode: cheerMode };
  }

  var VIEWS = ['today', 'calendar', 'money', 'campaign'];
  function currentView() {
    var h = (location.hash || '').replace(/^#/, '');
    return VIEWS.indexOf(h) >= 0 ? h : 'today';
  }
  function go(v) {
    if (currentView() === v) { render(); return; }
    location.hash = v;
  }

  function render(opts) {
    var v = currentView();
    $$('.view').forEach(function (el) { el.classList.toggle('on', el.id === 'view-' + v); });
    $$('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === v); });

    else if (v === 'calendar') renderCalendar();

    if (td) td.textContent = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일';
    syncCounts();

      if (el && el.focus) el.focus();

  function syncCounts() {
    $$('textarea[data-memo]').forEach(function (ta) {

  /* ============================================================
     조회 도우미
  ============================================================ */
  function evEnd(e) { return (e.endDate && e.endDate > e.date) ? e.endDate : e.date; }
  function evSpans(e) { return evEnd(e) > e.date; }
  function evCovers(e, d) { return e.date <= d && d <= evEnd(e); }
  function evRangeText(e) { return evSpans(e) ? mmdd(e.date) + ' ~ ' + mmdd(evEnd(e)) : ''; }
  function eventsOn(date) {
    return state.events.filter(function (e) { return evCovers(e, date); })
      .sort(function (a, b) {
        var as = evSpans(a) ? 0 : 1, bs = evSpans(b) ? 0 : 1;
        return as - bs || a.date.localeCompare(b.date) || (a.time || '00:00').localeCompare(b.time || '00:00');
      });
  }
  function upcoming(limit) {
    var t = todayStr();
    var list = state.events.filter(function (e) { return evEnd(e) >= t; })
      .sort(function (a, b) {
        var as = a.date < t ? t : a.date, bs = b.date < t ? t : b.date;
        return as.localeCompare(bs) || (a.time || '00:00').localeCompare(b.time || '00:00');
      });
    return limit ? list.slice(0, limit) : list;
  }
  function monthSpent(mk) {
    return state.expenses.filter(function (e) { return monthKey(e.date) === mk; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
  }
  function cardOf(id) {
    return state.cards.filter(function (c) { return c.id === id; })[0] ||
      { id: '', name: '기타', issuer: '기타', color: '#8C8C8C', target: 0, memo: '' };
  }
  function cardLabel(c) { return c.name || c.issuer || '카드'; }
  function campDate(c) { return c.due || c.visit || ''; }
  function ddayNum(c) {
    var d = campDate(c);
    if (!d) return null;
    return dayDiff(d, todayStr());
  }
  function ddayText(n) {
    if (n === null) return '날짜 미정';
    if (n === 0) return 'D-DAY';
    return n > 0 ? 'D-' + n : 'D+' + (-n);
  }
  function ddayClass(n) {
    if (n === null) return '';
    if (n < 0) return 'past';
    if (n <= 3) return 'hot';
    if (n <= 7) return 'soon';
    return '';
  }
  function urgentCampaign() {
    var best = null;
    state.campaigns.forEach(function (c) {
      var n = ddayNum(c);
      if (n !== null && n >= 0 && (!best || n < best.n)) best = { c: c, n: n };
    });
    return best;
  }

  /* ============================================================

  ============================================================ */
  function evRow(e) {
    var cat = catOf(e.cat);
    var span = evSpans(e);
    var days = span ? dayDiff(evEnd(e), e.date) + 1 : 0;
    return '<li class="ev' + (e.done ? ' done' : '') + (span ? ' span' : '') + '" style="--c:' + cat.c + '">' +

  /* 기간 선택(하루 / 일주일 7일 / 기간 지정) — 시작일·종료일 입력칸을 모드에 맞게 바꿈 */
  function rangeParts(rf) {
    return {
      box: rf.querySelector('.rfields'),
      startEl: rf.querySelector('input[name=startDate]'),
      endEl: rf.querySelector('input[name=endDate]'),
      endWrap: rf.querySelector('.rfld-end'),
      startK: rf.querySelector('[data-role=start-k]'),
      note: null,
      sum: rf.querySelector('.rsum')
    };
  }

  function rangeSummary(rf) {
    var p = rangeParts(rf);
    if (!p.sum || !p.startEl || !p.endEl) return;
    var mode = rf.getAttribute('data-range') || 'day';
    var s = p.startEl.value, e = p.endEl.value;
    if (mode === 'day' || !s || !e || e < s) { p.sum.hidden = true; return; }
    p.sum.hidden = false;
    p.sum.innerHTML = '<b>' + mmdd(s) + '(' + weekday(s) + ')</b> ~ <b>' + mmdd(e) + '(' + weekday(e) + ')</b> · ' + (dayDiff(e, s) + 1) + '일간';
  }

  function setRangeMode(rf, mode) {
    var p = rangeParts(rf);
    if (!p.startEl || !p.endEl) return;
    var base = rf.getAttribute('data-date') || todayStr();
    if (!p.startEl.value) p.startEl.value = base;
    var s = p.startEl.value || base;
    if (mode !== 'custom') mode = 'day';

    rf.setAttribute('data-range', mode);
    $$('.rchip', rf).forEach(function (b) {
      var on = b.getAttribute('data-range') === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    var two = mode === 'custom';
    if (p.box) { p.box.classList.toggle('two', two); p.box.setAttribute('data-mode', mode); }
    if (p.endWrap) p.endWrap.hidden = !two;
    if (p.startK) p.startK.textContent = two ? '시작일' : '날짜';

    if (!two) {
      p.endEl.value = '';
      p.endEl.removeAttribute('min');
    } else {
      if (!p.endEl.value || p.endEl.value <= s) p.endEl.value = addDays(s, 1);
      p.endEl.setAttribute('min', s);
    }
    rangeSummary(rf);
  }

      '<span class="dd' + (n <= 2 ? ' soon' : '') + '">' + dd + '</span>' +
      '</button></li>';
  }

  function copyText(t) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (err) { /* 복사가 막힌 환경에서는 조용히 넘어감 */ }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).catch(fallback);
        return;
      }
    } catch (err) { /* fallback으로 */ }
    fallback();
  }

  /* ============================================================
     캘린더
  ============================================================ */
  var LANE_CAP = 3;

  /* 한 주(7칸)에 걸친 기간 일정을 레인(줄)로 배치 */
  function weekSegs(week) {
    var wFirst = dstr(week[0]), wLast = dstr(week[6]);
    var list = state.events.filter(function (e) {
      return evSpans(e) && evEnd(e) >= wFirst && e.date <= wLast;
    }).sort(function (a, b) {
      return a.date.localeCompare(b.date) || evEnd(b).localeCompare(evEnd(a)) || String(a.title).localeCompare(String(b.title));
    });
    var laneEnd = [];
    return list.map(function (e) {
      var s = e.date > wFirst ? e.date : wFirst;
      var en = evEnd(e) < wLast ? evEnd(e) : wLast;
      var sc = dayDiff(s, wFirst), ec = dayDiff(en, wFirst);
      var lane = 0;
      while (laneEnd[lane] !== undefined && laneEnd[lane] >= sc) lane += 1;
      laneEnd[lane] = ec;
      return { e: e, sc: sc, ec: ec, lane: lane };
    });
  }

  function renderCalendar() {
    var y = cursor.y, m = cursor.m;
    var t = todayStr();
    var first = new Date(y, m, 1);
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((first.getDay() + daysInMonth) / 7);
    var start = new Date(y, m, 1 - first.getDay());
    var cells = [];
    for (var i = 0; i < rows * 7; i++) {
      cells.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    var weeks = [];
    for (var wi = 0; wi < rows; wi++) weeks.push(cells.slice(wi * 7, wi * 7 + 7));

    var calHtml = weeks.map(function (week) {
      var segs = weekSegs(week);
      var need = 0;
      segs.forEach(function (s) { if (s.lane + 1 > need) need = s.lane + 1; });
      var laneCount = Math.min(need, LANE_CAP);

      var cellsHtml = week.map(function (dt, ci) {
        var ds = dstr(dt);
        var other = dt.getMonth() !== m;
        var evs = eventsOn(ds);
        var seen = {};
        var dots = '';
        evs.forEach(function (e) {
          if (evSpans(e)) return;          /* 기간 일정은 띠로 그리므로 점은 하루 일정만 */
          if (seen[e.cat]) return;
          seen[e.cat] = 1;
          var cat = catOf(e.cat);
          dots += '<i class="dot" style="--c:' + cat.c + '"></i>';
        });

        var laneHtml = '';
        var hidden = 0;
        if (laneCount) {
          for (var li = 0; li < laneCount; li++) {
            var hit = null;
            for (var si = 0; si < segs.length; si++) {
              var sg = segs[si];
              if (sg.lane === li && sg.sc <= ci && ci <= sg.ec) { hit = sg; break; }
            }
            if (!hit) { laneHtml += '<span class="hlsp"></span>'; continue; }
            var hcat = catOf(hit.e.cat);
            var hcls = 'hl' + (hit.sc === ci ? ' s' : ' bl') + (hit.ec === ci ? ' e' : ' br');
            var label = hit.sc === ci ? hit.e.title : '';
            laneHtml += '<span class="' + hcls + '" style="--c:' + hcat.c + '"' +
              (label ? ' title="' + esc(hit.e.title + ' · ' + evRangeText(hit.e)) + '"' : ' aria-hidden="true"') + '>' +
              esc(label) + '</span>';
          }
          segs.forEach(function (sg) {
            if (sg.lane >= laneCount && sg.sc <= ci && ci <= sg.ec) hidden += 1;
          });
        }

        var more = hidden ? '<span class="more">+' + hidden + '</span>' : '';
        var memo = state.memos[ds] || '';
        var cls = 'cell' + (other ? ' other' : '') + (ds === t ? ' today' : '') + (ds === selected ? ' sel' : '');
        return '<button class="' + cls + '" data-act="select-day" data-date="' + ds + '" aria-label="' + (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일' + (evs.length ? ', 일정 ' + evs.length + '개' : '') + '">' +
          '<span class="dn">' + dt.getDate() + '</span>' +
          (laneCount ? '<span class="lanes">' + laneHtml + '</span>' : '') +
          more +
          (dots ? '<span class="dots">' + dots + '</span>' : '') +
          (memo ? '<span class="cm">' + esc(memo.slice(0, 24)) + '</span>' : '') +
          '</button>';
      }).join('');

      return '<div class="wk">' + cellsHtml + '</div>';
    }).join('');

    var selEvs = eventsOn(selected);
    var selD = parseD(selected);
    var selDiff = dayDiff(selected, t);
    var selChip = selDiff === 0 ? '오늘' : ddayText(selDiff);

    $('#view-calendar').innerHTML =
      '<div class="view-head"><div><p class="eyebrow">Calendar</p><h1 class="display">캘린더</h1></div></div>' +
      '<div class="cal-grid-wrap">' +
        '<div class="card cal-card">' +
          '<div class="cal-head">' +
            '<div class="cal-title"><span class="y">' + y + '</span>' + (m + 1) + '월</div>' +
            '<div class="cal-nav">' +
              '<button data-act="cal-prev" aria-label="이전 달">‹</button>' +
              '<button class="todaybtn" data-act="cal-today">오늘</button>' +
              '<button data-act="cal-next" aria-label="다음 달">›</button>' +
            '</div>' +
          '</div>' +
          '<div class="dow">' + WD.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
          '<div class="cal">' + calHtml + '</div>' +
          '<div class="legend">' + catOrder().map(function (c) {
            return '<span><i style="--c:' + catOf(c).c + '"></i>' + c + '</span>';
          }).join('') + '</div>' +
        '</div>' +
        '<div class="card day-panel">' +
          '<div class="day-head"><h2>' + (selD.getMonth() + 1) + '월 ' + selD.getDate() + '일<span class="wd">' + WD[selD.getDay()] + '요일</span></h2>' +
          '<span class="dchip">' + selChip + '</span></div>' +
          (selEvs.length ? '<ul class="ev-list">' + selEvs.map(evRow).join('') + '</ul>'
            : '<p class="empty">이 날은 일정이 없어요.<br>아래에서 바로 추가할 수 있어요.</p>') +
          eventForm(selected) +
          '<div class="day-memo">' +
            '<label>한줄 메모</label>' +
            '<textarea class="memo" data-memo="' + selected + '" rows="2" placeholder="이 날의 한 줄..." maxlength="300">' + esc(state.memos[selected] || '') + '</textarea>' +
            '<div class="memo-foot"><span class="subtle" data-savehint>자동 저장</span><span class="subtle" data-count>0/300</span></div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function cardTile(c) {

      '<span class="mc-top"><i></i>' + esc(c.issuer || '카드') + '</span>' +

        '</div>' +

      '<div class="money-grid">' +
        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head"><h2 class="card-title">내 카드</h2>' +
            (showCardForm || !cards.length ? '' : '<button class="btn btn-sm btn-soft" data-act="open-cardform">+ 카드 담기</button>') +
            '</div>' +
            cardsHtml +
            (showCardForm ? cardFormHtml() : '') +

          '<div class="card">' +
            '<div class="card-head"><h2 class="card-title">초간단 입력</h2><span class="subtle">오늘 날짜</span></div>' +
            quickHtml +
          '</div>' +
        '</div>' +
        '<div class="stack">' +
          '<div class="card">' +
            '<div class="list-head"><h2 class="card-title">이번 달 내역</h2>' +
            '<span class="list-total">' + num(total) + '원<small>' + exps.length + '건</small></span></div>' +
            listHtml +

  /* ============================================================
     체험단
  ============================================================ */
  function renderCampaign() {
    var cards = state.campaigns.slice().sort(function (a, b) {
      var da = campDate(a), db = campDate(b);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da.localeCompare(db);
    });

    var grid = cards.length ? '<div class="camp-grid">' + cards.map(function (c) {
      var n = ddayNum(c);
      var done = c.missions.filter(function (m) { return m.done; }).length;
      var pct = c.missions.length ? Math.round(done / c.missions.length * 100) : 0;
      return '<div class="card camp">' +
        '<div class="camp-top"><span class="plat">' + esc(c.platform || '체험단') + '</span>' +
        '<span class="dd ' + ddayClass(n) + '">' + ddayText(n) + '</span></div>' +
        '<h3>' + esc(c.name) + '</h3>' +
        '<p class="camp-meta">' +
          (c.visit ? '<span>방문 <b>' + mmdd(c.visit) + '</b></span>' : '') +
          (c.due ? '<span>마감 <b>' + mmdd(c.due) + '</b></span>' : '') +
          (c.memo ? '<span>' + esc(c.memo) + '</span>' : '') +
        '</p>' +
        '<ul class="miss">' + c.missions.map(function (m) {
          return '<li class="' + (m.done ? 'done' : '') + '">' +
            '<button class="mchk" data-act="toggle-mission" data-cid="' + c.id + '" data-mid="' + m.id + '" aria-pressed="' + (m.done ? 'true' : 'false') + '" aria-label="미션 완료">✓</button>' +
            '<span>' + esc(m.t) + '</span></li>';
        }).join('') + '</ul>' +
        '<div class="camp-foot">' +
          '<div class="track"><i style="width:' + pct + '%;--c:' + (done === c.missions.length && c.missions.length ? 'var(--ok)' : 'var(--accent)') + '"></i></div>' +
          '<span class="pct">' + done + '/' + c.missions.length + '</span>' +
          '<button class="del" data-act="del-campaign" data-id="' + c.id + '" aria-label="삭제">✕</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>' : '<div class="card camp-empty"><p class="empty">아직 등록된 체험단이 없어요.<br>받은 캠페인을 하나 적어 두면 마감일을 세어 드려요.</p><button class="empty-cta" type="button" data-act="toggle-campform">+ 새 체험단</button></div>';

    var form = '<form class="card camp-new" data-form="campaign">' +
      '<div class="field"><label>체험단 이름</label><input class="inp" name="name" placeholder="예: ○○ 베이커리 시식" required maxlength="60"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>플랫폼</label><input class="inp" name="platform" placeholder="플랫폼 이름 (선택)" maxlength="20"></div>' +
        '<div class="field"><label>방문일</label><input class="inp" type="date" name="visit"></div>' +
        '<div class="field"><label>마감일</label><input class="inp" type="date" name="due"></div>' +
      '</div>' +
      '<div class="field"><label>미션 (한 줄에 하나)</label><textarea class="inp" name="missions" rows="3" placeholder="사진 15장 이상&#10;영상 15초 이상&#10;블로그 발행"></textarea></div>' +
      '<div class="row" style="justify-content:flex-end">' +
        '<button type="button" class="btn btn-ghost" data-act="toggle-campform">취소</button>' +
        '<button class="btn btn-primary" type="submit">추가</button>' +
      '</div></form>';

    $('#view-campaign').innerHTML =
      '<div class="view-head">' +
        '<div><p class="eyebrow">Campaigns</p><h1 class="display">체험단 보드</h1></div>' +
        ((showCampForm || cards.length) ? '<button class="btn btn-sm ' + (showCampForm ? 'btn-ghost' : 'btn-primary') + '" data-act="toggle-campform">' + (showCampForm ? '닫기' : '+ 새 체험단') + '</button>' : '') +
      '</div>' +
      (showCampForm ? form : '') +
      grid;
  }

  /* ============================================================
     토스트
  ============================================================ */
  var toastTimer = null;
  function toast(msg, label, fn) {
    var el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button type="button">' + esc(label) + '</button>' : '');
    el.classList.add('show');
    if (label && fn) {
      var b = el.querySelector('button');
      if (b) b.addEventListener('click', function () { fn(); el.classList.remove('show'); });
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4200);
  }

  /* ============================================================
     시트(설정)
  ============================================================ */
  function openSheet() {
    var sh = $('#sheet');
    sh.hidden = false;
    var size = 0;
    try { size = new Blob([JSON.stringify(state)]).size; } catch (e) { size = JSON.stringify(state).length; }
    $('#storageInfo').textContent = '저장됨 · 일정 ' + state.events.length + ' · 카드 ' + state.cards.length +
      ' · 내역 ' + state.expenses.length + ' · 체험단 ' + state.campaigns.length + ' · 약 ' + (size / 1024).toFixed(1) + 'KB';
  }
  function closeSheet() { $('#sheet').hidden = true; }

  function exportJSON() {
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'diary-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('백업 파일을 내보냈어요');
  }

  function importJSON(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var d = JSON.parse(String(fr.result));
        if (!d || (!Array.isArray(d.events) && !Array.isArray(d.cards) && !Array.isArray(d.expenses))) throw new Error('bad');
        var ok = window.confirm('지금 기록을 이 파일로 바꿀까요?\n(현재 기록은 사라져요)');
        if (!ok) return;
        state = normalize(d);
        pickedCard = state.cards[0] ? state.cards[0].id : '';
        save();
        closeSheet();
        render();
        toast('백업 파일을 가져왔어요');
      } catch (err) {
        window.alert('파일을 읽을 수 없어요.\n내보내기로 만든 JSON 파일인지 확인해 주세요.');
      }
    };
    fr.readAsText(file);
  }

  /* ============================================================
     클릭 처리
  ============================================================ */
  document.addEventListener('click', function (e) {
    var tabBtn = e.target.closest('[data-tab]');
    if (tabBtn && !tabBtn.closest('[data-act]')) {
      go(tabBtn.getAttribute('data-tab'));
      return;
    }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'tab') {
      e.preventDefault();
      go(el.getAttribute('data-tab'));
      return;
    }

    if (act === 'open-day') {
      e.preventDefault();
      selected = el.getAttribute('data-date');
      cursor = { y: parseD(selected).getFullYear(), m: parseD(selected).getMonth() };
      go('calendar');
      return;
    }

    if (act === 'cheer-mode') {
      var cm = el.getAttribute('data-mode') === 'partner' ? 'partner' : 'self';
      if (cm !== cheerMode) { cheerMode = cm; cheerOffset = 0; render(); }
      return;
    }
    if (act === 'cheer-next') {
      cheerOffset = (cheerOffset + 1) % cheerList().length;
      render();
      return;
    }
    if (act === 'cheer-copy') {
      var qq = cheerText();
      copyText(qq.text);
      toast('문구를 복사했어요 · 카톡에 붙여넣기 하세요');
      return;
    }

    if (act === 'pick-cat-color') {
      e.preventDefault();
      var cbox = el.closest('.catnew');
      if (!cbox) return;
      cbox.setAttribute('data-color', el.getAttribute('data-color') || CAT_SWATCH[0].c);
      $$('.csw', cbox).forEach(function (b) {
        var on = b === el;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      return;
    }

    if (act === 'range-chip') {
      e.preventDefault();
      var rf = el.closest('form');
      if (!rf) return;
      setRangeMode(rf, el.getAttribute('data-range') || 'day');
      return;
    }

    if (act === 'focus-event') {
      if (currentView() !== 'today') go('today');
      var ti = $('#view-today .add-form input[name=title]');
      if (ti) {
        if (ti.scrollIntoView) ti.scrollIntoView({ block: 'center', behavior: 'smooth' });
        ti.focus();
      }
      return;
    }

    /* ---- 캘린더 ---- */
    if (act === 'cal-prev' || act === 'cal-next') {
      var delta = act === 'cal-prev' ? -1 : 1;
      var day = parseD(selected).getDate();
      cursor = { y: cursor.y, m: cursor.m + delta };
      var nd = new Date(cursor.y, cursor.m, 1);
      cursor = { y: nd.getFullYear(), m: nd.getMonth() };
      var dim = new Date(cursor.y, cursor.m + 1, 0).getDate();
      selected = dstr(new Date(cursor.y, cursor.m, Math.min(day, dim)));
      render();
      return;
    }
    if (act === 'cal-today') {
      var tn = new Date();
      cursor = { y: tn.getFullYear(), m: tn.getMonth() };
      selected = todayStr();
      render();
      return;
    }
    if (act === 'select-day') {
      selected = el.getAttribute('data-date');
      var sd = parseD(selected);
      if (sd.getMonth() !== cursor.m || sd.getFullYear() !== cursor.y) {
        cursor = { y: sd.getFullYear(), m: sd.getMonth() };
      }
      render();
      return;
    }
    if (act === 'toggle-event') {
      var ev = state.events.filter(function (x) { return x.id === id; })[0];
      if (ev) { ev.done = !ev.done; save(); render(); }
      return;
    }
    if (act === 'del-event') {
      var idx = state.events.findIndex(function (x) { return x.id === id; });
      if (idx < 0) return;
      var removed = state.events.splice(idx, 1)[0];
      save(); render();
      toast('일정을 지웠어요', '실행취소', function () {
        state.events.push(removed); save(); render();
      });
      return;
    }

    /* ---- 가계부 ---- */
    if (act === 'money-prev' || act === 'money-next') {
      var md = act === 'money-prev' ? -1 : 1;
      var nm = new Date(moneyCursor.y, moneyCursor.m + md, 1);
      moneyCursor = { y: nm.getFullYear(), m: nm.getMonth() };
      render();
      return;
    }
    if (act === 'open-cardform') {
      showCardForm = true; editingCard = null; render();
      var ni = $('#view-money input[name=name]');
      if (ni) ni.focus();
      return;
    }
    if (act === 'cancel-card') {
      showCardForm = false; editingCard = null; render();
      return;
    }
    if (act === 'edit-card') {
      var cc = state.cards.filter(function (x) { return x.id === id; })[0];
      if (!cc) return;
      editingCard = cc; showCardForm = true; render();
      var cf = $('#view-money form[data-form=card]');
      if (cf && cf.scrollIntoView) cf.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    if (act === 'del-card') {
      var keep = state.cards.filter(function (x) { return x.id !== id; })[0];
      var cnt = state.expenses.filter(function (x) { return x.cardId === id; }).length;
      if (!window.confirm('이 카드를 지울까요?' + (cnt ? '\n이 카드로 쓴 내역 ' + cnt + '건도 함께 지워져요.' : ''))) return;
      state.cards = state.cards.filter(function (x) { return x.id !== id; });
      state.expenses = state.expenses.filter(function (x) { return x.cardId !== id; });
      if (pickedCard === id) pickedCard = keep ? keep.id : '';
      showCardForm = false; editingCard = null;
      save(); render();
      toast('카드를 지웠어요');
      return;
    }
    if (act === 'pick-card') {
      pickedCard = id;
      var qf = $('#view-money form[data-form=expense]');
      if (qf) {
        var hi = qf.querySelector('input[name=card]');
        if (hi) hi.value = id;
      }
      $$('#view-money .pick').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-id') === id); });
      return;
    }
    if (act === 'pick-issuer') {
      var f = el.closest('form');
      if (!f) return;
      f.querySelector('input[name=issuer]').value = el.getAttribute('data-issuer');
      var col = el.getAttribute('data-color');
      if (col) {
        f.querySelector('input[name=color]').value = col;
        $$('.sw', f).forEach(function (s) { s.classList.toggle('on', s.getAttribute('data-color').toLowerCase() === col.toLowerCase()); });
      }
      $$('.iss', f).forEach(function (s) { s.classList.toggle('on', s === el); });
      return;
    }
    if (act === 'pick-color') {
      var f2 = el.closest('form');
      if (!f2) return;
      var col2 = el.getAttribute('data-color');
      f2.querySelector('input[name=color]').value = col2;
      $$('.sw', f2).forEach(function (s) { s.classList.toggle('on', s === el); });
      return;
    }
    if (act === 'del-exp') {
      var ei = state.expenses.findIndex(function (x) { return x.id === id; });
      if (ei < 0) return;
      var gone = state.expenses.splice(ei, 1)[0];
      save(); render();
      toast('내역을 지웠어요', '실행취소', function () {
        state.expenses.push(gone); save(); render();
      });
      return;
    }

    /* ---- 체험단 ---- */
    if (act === 'toggle-campform') {
      showCampForm = !showCampForm; render();
      if (showCampForm) { var cn = $('#view-campaign input[name=name]'); if (cn) cn.focus(); }
      return;
    }
    if (act === 'toggle-mission') {
      var camp = state.campaigns.filter(function (x) { return x.id === el.getAttribute('data-cid'); })[0];
      if (!camp) return;
      var mid = el.getAttribute('data-mid');
      var mi = camp.missions.filter(function (m) { return m.id === mid; })[0];
      if (mi) { mi.done = !mi.done; save(); render(); }
      return;
    }
    if (act === 'del-campaign') {
      var ci = state.campaigns.findIndex(function (x) { return x.id === id; });
      if (ci < 0) return;
      var cres = state.campaigns.splice(ci, 1)[0];
      save(); render();
      toast('체험단을 지웠어요', '실행취소', function () { state.campaigns.push(cres); save(); render(); });
      return;
    }

    /* ---- 설정 ---- */
    if (act === 'settings') { openSheet(); return; }
    if (act === 'close-sheet') { closeSheet(); return; }
    if (act === 'export') { exportJSON(); return; }
    if (act === 'import') { $('#importFile').click(); return; }
    if (act === 'reset') {
      if (!window.confirm('모든 기록을 지우고 빈 다이어리로 되돌릴까요?\n(되돌릴 수 없어요)')) return;
      state = seed();
      pickedCard = ''; showCardForm = false; editingCard = null;
      save(); closeSheet(); render();
      toast('빈 다이어리로 되돌렸어요');
      return;
    }
  });

  /* ============================================================
     폼 제출
  ============================================================ */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || !f.dataset || !f.dataset.form) return;
    e.preventDefault();
    var kind = f.dataset.form;

    if (kind === 'event') {
      var title = String(f.elements.title.value || '').trim();
      if (!title) return;
      var mode = f.getAttribute('data-range') || 'day';
      var startEl = f.querySelector('input[name=startDate]');
      var startD = (startEl && startEl.value) ? startEl.value : (f.getAttribute('data-date') || todayStr());
      var endD = '';
      var endEl = f.querySelector('input[name=endDate]');
      if (mode !== 'day' && endEl && endEl.value) endD = endEl.value;
      if (endD && endD < startD) {
        toast('종료일이 시작일보다 빨라요');
        if (endEl) endEl.focus();
        rangeSummary(f);
        return;
      }
      if (endD === startD) endD = '';
      var catName = resolveCat(f);
      if (!catName) return;
      lastCat = catName;
      var item = {
        id: uid(), date: startD, endDate: endD, time: f.elements.time.value || '',
        title: title, cat: catName, done: false
      };
      state.events.push(item);
      save(); render();
      toast(endD ? '기간 일정을 추가했어요 (' + evRangeText(item) + ')' : '일정을 추가했어요', '실행취소', function () {
        state.events = state.events.filter(function (x) { return x.id !== item.id; });
        save(); render();
      });
      return;
    }

    if (kind === 'expense') {
      var amount = digits(f.elements.amount.value);
      var memo = String(f.elements.memo.value || '').trim();
      var cardId = String(f.elements.card.value || '');
      if (!cardId) { toast('카드를 먼저 담아 주세요'); return; }
      if (!amount) { toast('금액을 입력해 주세요'); f.elements.amount.focus(); return; }
      var exp = { id: uid(), date: todayStr(), cardId: cardId, amount: amount, memo: memo, ts: Date.now() };
      state.expenses.push(exp);
      var nn = new Date();
      moneyCursor = { y: nn.getFullYear(), m: nn.getMonth() };
      save(); render();
      var ai = $('#view-money .amount-inp');
      if (ai) ai.focus();
      toast(cardLabel(cardOf(cardId)) + ' · ' + num(amount) + '원 기록', '실행취소', function () {
        state.expenses = state.expenses.filter(function (x) { return x.id !== exp.id; });
        save(); render();
      });
      return;
    }

    if (kind === 'card') {
      var cname = String(f.elements.name.value || '').trim();
      if (!cname) { f.elements.name.focus(); return; }
      var cid = String(f.elements.id.value || '');
      var payload = {
        issuer: String(f.elements.issuer.value || '').trim(),
        name: cname,
        color: String(f.elements.color.value || '#8C8C8C'),
        target: digits(f.elements.target.value),
        memo: String(f.elements.memo.value || '').trim()
      };
      if (cid) {
        state.cards = state.cards.map(function (c) { return c.id === cid ? Object.assign({}, c, payload) : c; });
      } else {
        var newCard = Object.assign({ id: uid() }, payload);
        state.cards.push(newCard);
        pickedCard = newCard.id;
      }
      showCardForm = false;
      editingCard = null;
      save(); render();
      toast(cid ? '카드 정보를 고쳤어요' : cname + ' 카드를 담았어요');
      return;
    }

    if (kind === 'campaign') {
      var nm = String(f.elements.name.value || '').trim();
      if (!nm) return;
      var missions = String(f.elements.missions.value || '').split('\n')
        .map(function (s) { return s.trim(); })
        .filter(Boolean)
        .map(function (t) { return { id: uid(), t: t, done: false }; });
      var camp = {
        id: uid(), name: nm,
        platform: String(f.elements.platform.value || '').trim(),
        visit: f.elements.visit.value || '', due: f.elements.due.value || '',
        memo: '', missions: missions
      };
      state.campaigns.push(camp);
      showCampForm = false;
      save(); render();
      toast('체험단을 추가했어요', '실행취소', function () {
        state.campaigns = state.campaigns.filter(function (x) { return x.id !== camp.id; });
        save(); render();
      });
      return;
    }
  });

  /* ============================================================
     메모 입력 (리렌더 없이 저장)
  ============================================================ */
  document.addEventListener('input', function (e) {
    var ta = e.target;
    if (!ta || !ta.matches || !ta.matches('textarea[data-memo]')) return;
    var date = ta.getAttribute('data-memo');
    var val = ta.value;
    if (val.trim()) state.memos[date] = val; else delete state.memos[date];
    saveSoon();
    var card = ta.closest('.card');
    if (card) {
      var hint = card.querySelector('[data-savehint]');
      if (hint) { hint.textContent = '저장 중…'; setTimeout(function () { hint.textContent = '저장됨 ✓'; }, 420); }
      var cnt = card.querySelector('[data-count]');
      if (cnt) cnt.textContent = val.length + '/300';
    }
  });

  /* 기간 입력 — 시작일을 바꾸면 종료일 최소값을 따라가게 */
  function syncRangeInput(e) {
    var t = e.target;
    if (!t || !t.matches || !t.matches('input[name=startDate], input[name=endDate]')) return;
    var rf = t.closest('form[data-form=event]');
    if (!rf) return;
    var p = rangeParts(rf);
    if (!p.startEl || !p.endEl) return;
    var mode = rf.getAttribute('data-range') || 'day';
    var s = p.startEl.value, en = p.endEl.value;
    if (!s || mode !== 'custom') return;
    if (t.name === 'startDate') {
      if (en && en < s) p.endEl.value = addDays(s, 1);
    } else if (en && en < s) {
      p.endEl.value = s;
    }
    p.endEl.setAttribute('min', s);
    rangeSummary(rf);
  }
  document.addEventListener('input', syncRangeInput);
  document.addEventListener('change', syncRangeInput);

  /* 카테고리 select — '＋ 직접 입력…' 이면 이름·색 입력줄을 열고, 저장 때 새 카테고리로 등록 */
  function resolveCat(f) {
    var sel = f.elements.cat;
    var val = sel ? String(sel.value || '') : '';
    if (val !== NEW_CAT) return (CATS[val] || customCats()[val]) ? val : '가족';
    var box = f.querySelector('.catnew');
    var inp = box ? box.querySelector('input[name=newCat]') : null;
    var nm = String(inp && inp.value || '').trim().replace(/\s+/g, ' ').slice(0, 10);
    if (!nm) {
      toast('새 카테고리 이름을 먼저 적어 주세요');
      if (inp) inp.focus();
      return '';
    }
    if (CATS[nm] || nm === NEW_CAT) return CATS[nm] ? nm : '가족';
    var col = (box && box.getAttribute('data-color')) || CAT_SWATCH[0].c;
    state.cats = customCats();
    if (!state.cats[nm]) state.cats[nm] = { c: col, e: '🏷️' };
    return nm;
  }

  function syncCatSelect(e) {
    var t = e.target;
    if (!t || !t.matches || !t.matches('select[name=cat]')) return;
    var f = t.closest('form[data-form=event]');
    if (!f) return;
    var box = f.querySelector('.catnew');
    if (!box) return;
    var on = t.value === NEW_CAT;
    box.hidden = !on;
    if (on) {
      var inp = box.querySelector('input[name=newCat]');
      if (inp) {
        if (inp.scrollIntoView) inp.scrollIntoView({ block: 'nearest' });
        inp.focus();
      }
    }
  }
  document.addEventListener('change', syncCatSelect);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });
  var fileInput = $('#importFile');
  if (fileInput) {
    fileInput.addEventListener('change', function () {
      if (fileInput.files && fileInput.files[0]) importJSON(fileInput.files[0]);
      fileInput.value = '';
    });
  }

  window.addEventListener('hashchange', function () {
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });

  if (!location.hash) history.replaceState(null, '', '#today');
  render();
})();

</script>
</body>
</html>
